title: Exfiltration Over Alternative Protocol - DNS or HTTPS Data Tunneling
id: f6a7b8c9-0015-4e5f-8a9b-cloud015
status: experimental
description: Detects anomalous outbound DNS query volume or unusual HTTPS egress patterns from EC2 instances or Lambda functions, indicating potential data exfiltration via covert channels.
references:
  - https://attack.mitre.org/techniques/T1048/
author: Odis Huff III
date: 2026-01-01
tags:
  - attack.exfiltration
  - attack.t1048
logsource:
  product: aws
  service: vpc_flow_log
detection:
  selection_dns:
    dstPort: 53
    action: ACCEPT
  selection_high_volume:
    bytes|gt: 100000
  timeframe: 5m
  condition: selection_dns and selection_high_volume | count() by srcAddr > 1000
fields:
  - srcAddr
  - dstAddr
  - dstPort
  - bytes
falsepositives:
  - High-volume DNS resolvers
  - Legitimate CDN communications
level: medium
