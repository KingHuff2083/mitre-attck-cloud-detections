title: Unused or Unsupported Cloud Regions - Resource Creation in Unexpected Region
id: f6a7b8c9-0014-4e5f-8a9b-cloud014
status: experimental
description: Detects creation of cloud resources in regions not used by the organization. Adversaries use non-standard regions to evade monitoring and establish persistence.
references:
  - https://attack.mitre.org/techniques/T1535/
author: Odis Huff III
date: 2026-01-01
tags:
  - attack.defense_evasion
  - attack.t1535
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName:
      - RunInstances
      - CreateFunction
      - CreateCluster
      - CreateBucket
  filter_approved_regions:
    awsRegion:
      - us-east-1
      - us-west-2
      - eu-west-1
  condition: selection and not filter_approved_regions
fields:
  - userIdentity.arn
  - awsRegion
  - eventName
  - sourceIPAddress
falsepositives:
  - Approved disaster recovery in secondary regions
  - New regional expansions
level: high
