title: Impair Defenses - CloudTrail Logging Disabled
id: c3d4e5f6-0006-4e5f-8a9b-cloud006
status: stable
description: Detects attempts to stop, delete, or modify CloudTrail logging configuration. Adversaries disable logging to evade detection during an intrusion.
references:
  - https://attack.mitre.org/techniques/T1562/008/
author: Odis Huff III
date: 2026-01-01
tags:
  - attack.defense_evasion
  - attack.t1562
  - attack.t1562.008
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: cloudtrail.amazonaws.com
    eventName:
      - StopLogging
      - DeleteTrail
      - UpdateTrail
      - PutEventSelectors
  condition: selection
fields:
  - userIdentity.arn
  - requestParameters.name
  - sourceIPAddress
falsepositives:
  - Authorized security team maintenance
level: critical
