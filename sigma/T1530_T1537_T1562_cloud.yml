title: Data from Cloud Storage - S3 Bucket Mass Download
id: c3d4e5f6-0004-4e5f-8a9b-cloud004
status: experimental
description: Detects unusually large numbers of S3 GetObject calls within a short window, potentially indicating data exfiltration from cloud object storage.
references:
  - https://attack.mitre.org/techniques/T1530/
author: Odis Huff III
date: 2026-01-01
tags:
  - attack.collection
  - attack.t1530
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: s3.amazonaws.com
    eventName: GetObject
  timeframe: 5m
  condition: selection | count() by userIdentity.arn > 500
fields:
  - userIdentity.arn
  - requestParameters.bucketName
  - sourceIPAddress
falsepositives:
  - Batch processing jobs
  - Legitimate bulk data migrations
level: high
---
title: Transfer Data to Cloud Account - Cross-Account S3 Replication
id: c3d4e5f6-0005-4e5f-8a9b-cloud005
status: experimental
description: Detects S3 data being replicated or copied to buckets in external AWS accounts not belonging to the organization, indicating potential data exfiltration.
references:
  - https://attack.mitre.org/techniques/T1537/
author: Odis Huff III
date: 2026-01-01
tags:
  - attack.exfiltration
  - attack.t1537
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: s3.amazonaws.com
    eventName:
      - PutBucketReplication
      - CopyObject
  filter_internal:
    requestParameters.bucketName|contains: 'internal-'
  condition: selection and not filter_internal
fields:
  - userIdentity.arn
  - requestParameters.bucketName
  - requestParameters.destinationBucket
falsepositives:
  - Approved cross-account data sharing
level: high
