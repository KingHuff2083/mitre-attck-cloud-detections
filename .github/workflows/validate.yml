name: Validate Sigma Rules

on:
  push:
    branches: [main, develop]
    paths:
      - 'sigma/**'
  pull_request:
    branches: [main]
    paths:
      - 'sigma/**'

jobs:
  sigma-validate:
    name: Sigma Rule Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check YAML syntax
        run: |
          pip install pyyaml
          python3 - << 'PYEOF'
          import yaml, glob, sys
          errors = []
          for f in glob.glob('sigma/*.yml'):
              try:
                  docs = list(yaml.safe_load_all(open(f)))
                  for doc in docs:
                      if doc and 'title' in doc:
                          print(f"  ✅ {doc['title']}")
              except Exception as e:
                  errors.append(f"  ❌ {f}: {e}")
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          print('\n✅ All rules passed YAML validation')
          PYEOF

      - name: Validate required fields
        run: |
          python3 - << 'PYEOF'
          import yaml, glob, sys
          required = ['title', 'status', 'description', 'tags', 'logsource', 'detection']
          errors = []
          count = 0
          for f in glob.glob('sigma/*.yml'):
              for doc in yaml.safe_load_all(open(f)):
                  if not doc or 'title' not in doc: continue
                  count += 1
                  missing = [r for r in required if r not in doc]
                  if missing:
                      errors.append(f"  ❌ {doc['title']}: missing {missing}")
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          print(f'✅ {count} rules validated — all required fields present')
          PYEOF

      - name: Coverage summary
        run: |
          python3 - << 'PYEOF'
          import yaml, glob
          from collections import Counter
          levels = Counter()
          count = 0
          for f in glob.glob('sigma/*.yml'):
              for doc in yaml.safe_load_all(open(f)):
                  if not doc or 'title' not in doc: continue
                  count += 1
                  levels[doc.get('level','unknown')] += 1
          print(f'Total rules : {count}')
          print(f'By severity : {dict(levels)}')
          PYEOF
